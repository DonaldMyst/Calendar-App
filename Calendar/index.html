<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="calendar-wrapper">
            <div class="calendar">
                <div class="left">
                    <p id="date">01</p>
                    <p id="day">Sunday</p>
                </div>
                <div class="right">
                    <div class="nav">
                        <button id="prev">&#10094;</button>
                        <button id="next">&#10095;</button>
                    </div>
                    <p id="month">January</p>
                    <p id="year">2020</p>
                </div>
            </div>
            <div class="weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
